name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 21 * * *"   # runs daily at 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shaaravraghu

      # Remove ONLY the unwanted bottom-left chart and bottom statistics
      # Then convert DP.png to vector SVG and place it on top.
      - name: Remove chart, statistics and add DP
        run: |
          find profile-3d-contrib -type f ! -name "profile-gitblock.svg" -delete

          # ---------------------------------------------------------
          # Verify DP.png
          # ---------------------------------------------------------
          echo "Checking DP.png..."

          if [ ! -f "DP.png" ]; then
            echo "ERROR: DP.png not found!"
            exit 1
          fi

          file DP.png

          if ! file DP.png | grep -qi "PNG image data"; then
            echo "ERROR: DP.png is not a valid PNG!"
            exit 1
          fi

          echo "DP.png verified successfully."

          # ---------------------------------------------------------
          # Install VTracer
          # ---------------------------------------------------------
          python3 -m pip install --user vtracer==0.6.15

          # ---------------------------------------------------------
          # Convert DP.png -> vector SVG
          #
          # Slightly more aggressive settings reduce the final SVG
          # size considerably while retaining the photograph's
          # important visual features.
          # ---------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import vtracer

          input_file = Path("DP.png").resolve()
          output_file = Path("DP.svg").resolve()

          print(f"Input : {input_file}")
          print(f"Output: {output_file}")

          vtracer.convert_image_to_svg_py(
              str(input_file),
              str(output_file),

              colormode="color",

              # Keep stacked color regions
              hierarchical="stacked",

              # Spline gives smoother photographic contours
              mode="spline",

              filter_speckle=20,
              color_precision=6,
              layer_difference=12,
              corner_threshold=60,
              length_threshold=4.0,
              max_iterations=10,
              splice_threshold=45,
              path_precision=3
          )

          if not output_file.exists():
              raise RuntimeError(
                  "VTracer failed to create DP.svg"
              )

          print(
              f"Created DP.svg "
              f"({output_file.stat().st_size} bytes)"
          )
          PY

          # ---------------------------------------------------------
          # Insert vector DP into profile-gitblock.svg
          # ---------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg_file = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          dp_svg_file = Path("DP.svg")

          if not svg_file.exists():
              raise FileNotFoundError(
                  f"Could not find {svg_file}"
              )

          if not dp_svg_file.exists():
              raise FileNotFoundError(
                  "DP.svg was not created."
              )

          svg = svg_file.read_text()
          # ---------------------------------------------------------
          # CHANGE THE ACTUAL SVG BACKGROUND
          # ---------------------------------------------------------

          BACKGROUND = "#f7e700"

          # ---------------------------------------------------------
          # Read SVG root
          # ---------------------------------------------------------
          root_match = re.search(
              r"<svg[^>]*>",
              svg,
              flags=re.DOTALL
          )

          if not root_match:
              raise RuntimeError(
                  "Could not find SVG root."
              )

          root_tag = root_match.group(0)

          # ---------------------------------------------------------
          # Get SVG viewBox
          # ---------------------------------------------------------
          viewbox_match = re.search(
              r'viewBox=["\']([^"\']+)["\']',
              root_tag,
              flags=re.IGNORECASE
          )

          if viewbox_match:

              vb = viewbox_match.group(1).split()

              if len(vb) == 4:
                  canvas_x = float(vb[0])
                  canvas_y = float(vb[1])
                  canvas_w = float(vb[2])
                  canvas_h = float(vb[3])

              else:
                  canvas_x = 0
                  canvas_y = 0
                  canvas_w = None
                  canvas_h = None

          else:

              width_match = re.search(
                  r'\bwidth=["\']([0-9.]+)',
                  root_tag,
                  flags=re.IGNORECASE
              )

              height_match = re.search(
                  r'\bheight=["\']([0-9.]+)',
                  root_tag,
                  flags=re.IGNORECASE
              )

              canvas_x = 0
              canvas_y = 0

              canvas_w = (
                  float(width_match.group(1))
                  if width_match
                  else None
              )

              canvas_h = (
                  float(height_match.group(1))
                  if height_match
                  else None
              )

          print(
              f"SVG canvas: "
              f"{canvas_w} x {canvas_h}"
          )

          # ---------------------------------------------------------
          # Find every RECTANGLE in the SVG
          # ---------------------------------------------------------
          rect_pattern = re.compile(
              r"<rect\b[^>]*(?:/>|>.*?</rect>)",
              flags=re.IGNORECASE | re.DOTALL
          )

          rects = rect_pattern.findall(svg)

          background_found = False

          for rect in rects:

              x_match = re.search(
                  r'\bx=["\']([^"\']+)["\']',
                  rect,
                  flags=re.IGNORECASE
              )

              y_match = re.search(
                  r'\by=["\']([^"\']+)["\']',
                  rect,
                  flags=re.IGNORECASE
              )

              width_match = re.search(
                  r'\bwidth=["\']([^"\']+)["\']',
                  rect,
                  flags=re.IGNORECASE
              )

              height_match = re.search(
                  r'\bheight=["\']([^"\']+)["\']',
                  rect,
                  flags=re.IGNORECASE
              )

              fill_match = re.search(
                  r'\bfill=["\']([^"\']+)["\']',
                  rect,
                  flags=re.IGNORECASE
              )

              if not width_match or not height_match:
                  continue

              x = float(
                  x_match.group(1)
              ) if x_match else 0

              y = float(
                  y_match.group(1)
              ) if y_match else 0

              width_text = width_match.group(1)
              height_text = height_match.group(1)

              fill = (
                  fill_match.group(1).lower()
                  if fill_match
                  else ""
              )

              # -----------------------------------------------------
              # Only consider white elements.
              #
              # This prevents us from modifying the white grid.
              # -----------------------------------------------------
              if fill not in {
                  "white",
                  "#fff",
                  "#ffffff"
              }:
                  continue

              # -----------------------------------------------------
              # Convert numeric dimensions where possible.
              # -----------------------------------------------------
              try:
                  width = float(width_text)
              except ValueError:
                  width = None

              try:
                  height = float(height_text)
              except ValueError:
                  height = None

              # -----------------------------------------------------
              # Detect full-canvas rectangle.
              # -----------------------------------------------------
              covers_width = (
                  width_text == "100%"
                  or (
                      canvas_w is not None
                      and width is not None
                      and width >= canvas_w * 0.98
                  )
              )

              covers_height = (
                  height_text == "100%"
                  or (
                      canvas_h is not None
                      and height is not None
                      and height >= canvas_h * 0.98
                  )
              )

              covers_canvas = (
                  abs(x - canvas_x) < 0.01
                  and
                  abs(y - canvas_y) < 0.01
                  and
                  covers_width
                  and
                  covers_height
              )

              if not covers_canvas:
                  continue

              print("")
              print("========================================")
              print("FOUND ORIGINAL BACKGROUND")
              print("========================================")
              print(rect)
              print("========================================")

              # -----------------------------------------------------
              # Change ONLY this rectangle.
              # -----------------------------------------------------
              if fill_match:

                  new_rect = re.sub(
                      r'(\bfill=["\'])[^"\']+(["\'])',
                      rf'\g<1>{BACKGROUND}\g<2>',
                      rect,
                      count=1,
                      flags=re.IGNORECASE
                  )

              else:

                  new_rect = rect.replace(
                      "/>",
                      f' fill="{BACKGROUND}" />'
                  )

              svg = svg.replace(
                  rect,
                  new_rect,
                  1
              )

              background_found = True
              break

          if not background_found:
              print("")
              print(
                  "WARNING: No full-canvas white rectangle found."
              )
              print(
                  "Printing first SVG rectangles for diagnosis:"
              )

              for i, rect in enumerate(rects[:15]):
                  print("")
                  print(f"RECT #{i + 1}:")
                  print(rect[:500])

              raise RuntimeError(
                  "Could not identify the original SVG background."
              )
          
          dp_svg = dp_svg_file.read_text()

          # ---------------------------------------------------------
          # Read the width and height from VTracer's SVG.
          #
          # VTracer 0.6.15 may provide:
          #
          #   width="1239"
          #   height="1269"
          #
          # instead of a viewBox.
          # ---------------------------------------------------------
          root_match = re.search(
              r"<svg[^>]*>",
              dp_svg,
              flags=re.DOTALL
          )

          if not root_match:
              raise RuntimeError(
                  "Could not find SVG root in DP.svg"
              )

          root_tag = root_match.group(0)

          width_match = re.search(
              r'width=["\']([0-9.]+)(?:px)?["\']',
              root_tag
          )

          height_match = re.search(
              r'height=["\']([0-9.]+)(?:px)?["\']',
              root_tag
          )

          # ---------------------------------------------------------
          # Prefer viewBox if one exists.
          # Otherwise construct one from width/height.
          # ---------------------------------------------------------
          viewbox_match = re.search(
              r'viewBox=["\']([^"\']+)["\']',
              root_tag
          )

          if viewbox_match:
              viewbox = viewbox_match.group(1)

              print(
                  f"DP.svg viewBox detected: {viewbox}"
              )

          elif width_match and height_match:

              width = float(width_match.group(1))
              height = float(height_match.group(1))

              viewbox = f"0 0 {width:g} {height:g}"

              print(
                  "DP.svg has no viewBox."
              )

              print(
                  f"Using dimensions: {width:g} x {height:g}"
              )

              print(
                  f"Constructed viewBox: {viewbox}"
              )

          else:
              raise RuntimeError(
                  "DP.svg has neither a viewBox nor "
                  "usable width/height attributes."
              )

          # ---------------------------------------------------------
          # Extract the contents inside VTracer's <svg>.
          # ---------------------------------------------------------
          content_match = re.search(
              r"<svg[^>]*>(.*?)</svg>",
              dp_svg,
              flags=re.DOTALL
          )

          if not content_match:
              raise RuntimeError(
                  "Could not extract DP.svg contents."
              )

          dp_content = content_match.group(1)

          # Remove XML declaration if present
          dp_content = re.sub(
              r"<\?xml.*?\?>",
              "",
              dp_content,
              flags=re.DOTALL
          )

          # ---------------------------------------------------------
          # Put the vector DP into a nested SVG viewport.
          #
          # Position:
          #   x = 0
          #   y = 650
          #
          # Size:
          #   400 x 400
          #
          # preserveAspectRatio keeps the original photo ratio.
          # ---------------------------------------------------------
          dp_vector = f"""
          <svg
            x="0"
            y="500"
            width="400"
            height="400"
            viewBox="{viewbox}"
            preserveAspectRatio="xMidYMid meet"
          >
            {dp_content}
          </svg>
          """

          # ---------------------------------------------------------
          # Mask unwanted circular language chart
          # ---------------------------------------------------------
          chart_mask = """
          <rect
            x="0"
            y="500"
            width="500"
            height="575"
            fill="#f7e700"
          />
          """

          # ---------------------------------------------------------
          # Mask bottom statistics
          # ---------------------------------------------------------
          bottom_mask = """
          <rect
            x="225"
            y="800"
            width="735"
            height="65"
            fill="#f7e700"
          />
          """

          # ---------------------------------------------------------
          # Add masks first, then DP.
          #
          # This guarantees DP is rendered ON TOP of the masks.
          # ---------------------------------------------------------
          insertion = (
              chart_mask +
              bottom_mask +
              dp_vector
          )

          if "</svg>" not in svg:
              raise RuntimeError(
                  "profile-gitblock.svg has no closing </svg>."
              )

          svg = svg.replace(
              "</svg>",
              insertion + "</svg>"
          )

          svg_file.write_text(svg)

          print(
              "Successfully inserted vector DP into:"
          )

          print(svg_file)
          PY

          # ---------------------------------------------------------
          # Remove temporary vector
          # ---------------------------------------------------------
          rm -f DP.svg

          echo ""
          echo "Final SVG generated successfully."

          
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if git commit -m "update: 3D contribution graph"; then
            git push
          else
            echo "no changes"
          fi

