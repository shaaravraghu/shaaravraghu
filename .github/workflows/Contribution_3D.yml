name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 21 * * *"   # runs daily at 03:00 IST

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: shaaravraghu/github-profile-3D@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shaaravraghu

      # Remove ONLY the unwanted bottom-left chart and bottom statistics
      # Then place the original DP.png directly on top.
      - name: Remove chart, statistics and add DP
        run: |
          find profile-3d-contrib -type f ! -name "profile-gitblock.svg" -delete

          # ---------------------------------------------------------
          # Verify DP.png
          # ---------------------------------------------------------
          echo "Checking DP.png..."

          if [ ! -f "DP.png" ]; then
            echo "ERROR: DP.png not found!"
            exit 1
          fi

          file DP.png

          if ! file DP.png | grep -qi "PNG image data"; then
            echo "ERROR: DP.png is not a valid PNG!"
            exit 1
          fi

          echo "DP.png verified successfully."

          # ---------------------------------------------------------
          # Insert ORIGINAL DP.png into profile-gitblock.svg
          #
          # IMPORTANT:
          # DP.png is NOT converted to SVG/vector.
          # It is embedded directly as a raster PNG using base64.
          # ---------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          svg_file = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          png_file = Path("DP.png")

          if not svg_file.exists():
              raise FileNotFoundError(
                  f"Could not find {svg_file}"
              )

          if not png_file.exists():
              raise FileNotFoundError(
                  "DP.png was not found."
              )

          # ---------------------------------------------------------
          # Read SVG
          # ---------------------------------------------------------
          svg = svg_file.read_text()

          # ---------------------------------------------------------
          # CHANGE SVG BACKGROUND
          # ---------------------------------------------------------
          BACKGROUND = "#f7e700"

          # Add background-color directly to root <svg>
          svg = re.sub(
              r"<svg([^>]*)>",
              lambda m: (
                  "<svg"
                  + m.group(1)
                  + f' style="background:{BACKGROUND};"'
                  + ">"
              ),
              svg,
              count=1
          )

          # Also add a background rectangle for renderers
          # that ignore CSS background on SVG.
          background = f"""
          <rect
            x="0"
            y="0"
            width="1280"
            height="850"
            fill="{BACKGROUND}"
          />
          """

          svg = re.sub(
              r"(<svg[^>]*>)",
              r"\1" + background,
              svg,
              count=1
          )

          print(
              f"Applied SVG background: {BACKGROUND}"
          )

          # ---------------------------------------------------------
          # Read ORIGINAL PNG
          # ---------------------------------------------------------
          png_data = png_file.read_bytes()

          # Convert PNG bytes to base64.
          # This does NOT vectorize or modify the image.
          png_base64 = base64.b64encode(png_data).decode("ascii")

          # ---------------------------------------------------------
          # Create raster PNG <image>
          #
          # The PNG is displayed at:
          #   x = 0
          #   y = 500
          #   width = 400
          #   height = 400
          #
          # preserveAspectRatio keeps the original image ratio.
          # ---------------------------------------------------------
          dp_image = f"""
          <image
            x="0"
            y="450"
            width="400"
            height="400"
            preserveAspectRatio="xMidYMid meet"
            href="data:image/png;base64,{png_base64}"
          />
          """

          # ---------------------------------------------------------
          # Put DP.png directly on TOP of the existing SVG
          # ---------------------------------------------------------
          if "</svg>" not in svg:
              raise RuntimeError(
                  "profile-gitblock.svg has no closing </svg>."
              )

          svg = svg.replace(
              "</svg>",
              dp_image + "</svg>",
              1
          )

          # ---------------------------------------------------------
          # Write final SVG
          # ---------------------------------------------------------
          svg_file.write_text(svg)

          print(
              "Successfully inserted ORIGINAL DP.png "
              "as a raster image into:"
          )

          print(svg_file)
          PY

          echo ""
          echo "Final SVG generated successfully."

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if git commit -m "update: 3D contribution graph"; then
            git push
          else
            echo "no changes"
          fi
