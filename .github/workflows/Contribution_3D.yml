name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 21 * * *"   # runs daily at 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shaaravraghu

      # Remove ONLY the unwanted bottom-left chart and bottom statistics
      # Then convert DP.png to a real SVG and place it on top.
      - name: Remove chart, statistics and add DP
        run: |
          find profile-3d-contrib -type f ! -name "profile-gitblock.svg" -delete

          # ---------------------------------------------------------
          # Install VTracer
          # ---------------------------------------------------------
          python3 -m pip install --upgrade vtracer

          # ---------------------------------------------------------
          # Convert DP.png -> REAL VECTOR SVG
          #
          # IMPORTANT:
          # This does NOT create <image href="...">.
          # VTracer creates actual SVG paths.
          # ---------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import vtracer

          input_file = Path("DP.png")
          output_file = Path("DP.svg")

          if not input_file.exists():
              raise FileNotFoundError(
                  f"Could not find {input_file}"
              )

          # Photo preset gives better results for a photograph.
          vtracer.Config.photo().convert_file(
              str(input_file),
              str(output_file)
          )

          print(f"Created vector SVG: {output_file}")
          PY

          # ---------------------------------------------------------
          # Insert the vector DP into the generated contribution SVG
          # ---------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg_dir = Path("profile-3d-contrib")
          dp_svg_path = Path("main/DP.svg")

          dp_svg = dp_svg_path.read_text()

          # ---------------------------------------------------------
          # Extract ONLY the contents inside <svg>...</svg>
          #
          # This prevents us from nesting a complete <svg> document
          # inside another SVG unnecessarily.
          # ---------------------------------------------------------
          match = re.search(
              r"<svg[^>]*>(.*?)</svg>",
              dp_svg,
              flags=re.DOTALL
          )

          if not match:
              raise RuntimeError(
                  "Could not extract vector contents from DP.svg"
              )

          dp_content = match.group(1)

          # ---------------------------------------------------------
          # Remove XML declarations / metadata if present
          # ---------------------------------------------------------
          dp_content = re.sub(
              r"<\?xml.*?\?>",
              "",
              dp_content,
              flags=re.DOTALL
          )

          # ---------------------------------------------------------
          # Wrap the vector DP in a group.
          #
          # Original DP SVG is scaled to 200x200 and positioned at:
          #
          # x = 25
          # y = 515
          # ---------------------------------------------------------
          dp_group = f"""
          <g
            transform="translate(25 515) scale(200 200)"
          >
            {dp_content}
          </g>
          """

          for svg_file in svg_dir.glob("*.svg"):

              svg = svg_file.read_text()

              # -----------------------------------------------------
              # 1. Cover the unwanted circular language chart
              # -----------------------------------------------------
              chart_mask = """
              <rect
                x="0"
                y="500"
                width="500"
                height="575"
                fill="white"
              />
              """

              # -----------------------------------------------------
              # 2. Cover the bottom statistics
              # -----------------------------------------------------
              bottom_mask = """
              <rect
                x="225"
                y="800"
                width="735"
                height="65"
                fill="white"
              />
              """

              # -----------------------------------------------------
              # 3. Add the VECTOR DP on top.
              #
              # There is deliberately NO <image> element here.
              # -----------------------------------------------------
              svg = svg.replace(
                  "</svg>",
                  chart_mask +
                  bottom_mask +
                  dp_group +
                  "</svg>"
              )

              svg_file.write_text(svg)

              print(f"Updated: {svg_file}")
          PY
          
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if git commit -m "update: 3D contribution graph"; then
            git push
          else
            echo "no changes"
          fi

