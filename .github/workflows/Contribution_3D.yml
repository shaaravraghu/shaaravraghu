name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 21 * * *"   # runs daily at 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shaaravraghu

      # Remove ONLY the unwanted bottom-left chart and bottom statistics
      # Then convert DP.png to a real vector SVG and place it on top.
      - name: Remove chart, statistics and add DP
        run: |
          find profile-3d-contrib -type f ! -name "profile-gitblock.svg" -delete

          # ---------------------------------------------------------
          # Locate DP.png anywhere in the repository
          # ---------------------------------------------------------
          DP_PATH=$(find "$GITHUB_WORKSPACE" -type f \
            \( -iname "DP.png" -o -iname "dp.png" \) \
            -print -quit)

          if [ -z "$DP_PATH" ]; then
            echo "ERROR: DP.png was not found anywhere in the repository."
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found DP image:"
          echo "$DP_PATH"

          # ---------------------------------------------------------
          # Verify that the file is actually an image
          # ---------------------------------------------------------
          echo ""
          echo "File information:"
          file "$DP_PATH"

          echo ""
          echo "Image size:"
          python3 - "$DP_PATH" <<'PY'
          from PIL import Image
          import sys

          image_path = sys.argv[1]

          try:
              image = Image.open(image_path)

              print(f"Format : {image.format}")
              print(f"Size   : {image.size}")
              print(f"Mode   : {image.mode}")

              image.verify()

              print("Image verification: OK")

          except Exception as e:
              print(f"ERROR: Cannot read image: {e}")
              sys.exit(1)
          PY

          # ---------------------------------------------------------
          # Install VTracer
          # ---------------------------------------------------------
          python3 -m pip install --user vtracer==0.6.15

          # ---------------------------------------------------------
          # Convert DP.png -> REAL VECTOR SVG
          # ---------------------------------------------------------
          python3 - "$DP_PATH" <<'PY'
          from pathlib import Path
          import sys
          import vtracer

          input_file = Path(sys.argv[1]).resolve()
          output_file = Path("main/DP.svg").resolve()

          print("========================================")
          print("VTracer conversion")
          print("========================================")
          print(f"Input : {input_file}")
          print(f"Output: {output_file}")
          print(f"Exists: {input_file.exists()}")
          print(f"Size  : {input_file.stat().st_size} bytes")
          print("========================================")

          if not input_file.exists():
              raise FileNotFoundError(
                  f"Input image does not exist: {input_file}"
              )

          output_file.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          # VTracer 0.6.15 API
          vtracer.convert_image_to_svg_py(
              str(input_file),
              str(output_file),
              colormode="color",
              hierarchical="stacked",
              mode="spline",
              filter_speckle=4,
              color_precision=6,
              layer_difference=16,
              corner_threshold=60,
              length_threshold=4.0,
              max_iterations=10,
              splice_threshold=45,
              path_precision=3
          )

          if not output_file.exists():
              raise RuntimeError(
                  "VTracer finished but DP.svg was not created."
              )

          print(f"Successfully created: {output_file}")
          print(f"SVG size: {output_file.stat().st_size} bytes")
          PY

          # ---------------------------------------------------------
          # Insert the vector DP into the generated contribution SVG
          # ---------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg_dir = Path("profile-3d-contrib")
          dp_svg_path = Path("main/DP.svg")

          if not dp_svg_path.exists():
              raise FileNotFoundError(
                  "main/DP.svg was not created."
              )

          dp_svg = dp_svg_path.read_text()

          # ---------------------------------------------------------
          # Extract the viewBox from DP.svg
          # ---------------------------------------------------------
          root_match = re.search(
              r"<svg[^>]*>",
              dp_svg,
              flags=re.DOTALL
          )

          if not root_match:
              raise RuntimeError(
                  "Could not find <svg> element in DP.svg"
              )

          svg_root = root_match.group(0)

          viewbox_match = re.search(
              r'viewBox=["\']([^"\']+)["\']',
              svg_root
          )

          if not viewbox_match:
              raise RuntimeError(
                  "DP.svg does not contain a viewBox."
              )

          viewbox = viewbox_match.group(1)

          print(f"DP.svg viewBox: {viewbox}")

          # ---------------------------------------------------------
          # Extract contents of DP.svg
          # ---------------------------------------------------------
          match = re.search(
              r"<svg[^>]*>(.*?)</svg>",
              dp_svg,
              flags=re.DOTALL
          )

          if not match:
              raise RuntimeError(
                  "Could not extract contents from DP.svg"
              )

          dp_content = match.group(1)

          # Remove XML declaration if present
          dp_content = re.sub(
              r"<\?xml.*?\?>",
              "",
              dp_content,
              flags=re.DOTALL
          )

          # ---------------------------------------------------------
          # Position and size of DP
          #
          # x = 25
          # y = 515
          # width = 200
          # height = 200
          # ---------------------------------------------------------
          dp_group = f"""
          <svg
            x="25"
            y="515"
            width="200"
            height="200"
            viewBox="{viewbox}"
            preserveAspectRatio="xMidYMid meet"
          >
            {dp_content}
          </svg>
          """

          # ---------------------------------------------------------
          # Modify every generated SVG
          # ---------------------------------------------------------
          for svg_file in svg_dir.glob("*.svg"):

              svg = svg_file.read_text()

              # -----------------------------------------------------
              # 1. Remove bottom-left language chart
              # -----------------------------------------------------
              chart_mask = """
              <rect
                x="0"
                y="500"
                width="500"
                height="575"
                fill="white"
              />
              """

              # -----------------------------------------------------
              # 2. Remove bottom statistics
              # -----------------------------------------------------
              bottom_mask = """
              <rect
                x="225"
                y="800"
                width="735"
                height="65"
                fill="white"
              />
              """

              # -----------------------------------------------------
              # 3. Add VECTOR DP on top
              # -----------------------------------------------------
              svg = svg.replace(
                  "</svg>",
                  chart_mask +
                  bottom_mask +
                  dp_group +
                  "</svg>"
              )

              svg_file.write_text(svg)

              print(f"Updated: {svg_file}")
          PY
          
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if git commit -m "update: 3D contribution graph"; then
            git push
          else
            echo "no changes"
          fi

