name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 21 * * *"   # runs daily at 03:00 IST

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: shaaravraghu/github-profile-3D@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shaaravraghu

      # ---------------------------------------------------------
      # Remove unwanted generated files and add custom images
      # ---------------------------------------------------------
      - name: Remove chart, statistics and add custom images
        run: |
          find profile-3d-contrib -type f ! -name "profile-gitblock.svg" -delete

          echo "Checking custom images..."

          # -------------------------------------------------------
          # Verify all required images exist
          # -------------------------------------------------------
          IMAGES=(
            "Among_Us.png"
            "CEO.png"
            "Claude_Crab.jpeg"
            "DP.png"
            "Dino.png"
            "Eat_Sleep_Code_Repeat.jpeg"
            "Error_404.jpeg"
            "Think_OutSide_The_Box.jpeg"
          )

          for IMAGE in "${IMAGES[@]}"; do
            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: $IMAGE not found!"
              exit 1
            fi

            echo "Found: $IMAGE"
            file "$IMAGE"
          done

          echo ""
          echo "All images verified successfully."

          # -------------------------------------------------------
          # Embed all images directly into profile-gitblock.svg
          # -------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          svg_file = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          if not svg_file.exists():
              raise FileNotFoundError(
                  f"Could not find {svg_file}"
              )

          # -------------------------------------------------------
          # Read SVG
          # -------------------------------------------------------
          svg = svg_file.read_text()

          # -------------------------------------------------------
          # SVG background
          # -------------------------------------------------------
          BACKGROUND = "#f7e700"

          # Add background style to root SVG
          svg = re.sub(
              r"<svg([^>]*)>",
              lambda m: (
                  "<svg"
                  + m.group(1)
                  + f' style="background:{BACKGROUND};"'
                  + ">"
              ),
              svg,
              count=1
          )

          # Add explicit background rectangle
          background = f"""
          <rect
            x="0"
            y="0"
            width="1280"
            height="850"
            fill="{BACKGROUND}"
          />
          """

          svg = re.sub(
              r"(<svg[^>]*>)",
              r"\1" + background,
              svg,
              count=1
          )

          print(
              f"Applied SVG background: {BACKGROUND}"
          )

          # -------------------------------------------------------
          # Image configuration
          #
          # x       = horizontal position
          # y       = vertical position
          # width   = displayed width
          # height  = displayed height
          #
          # preserveAspectRatio keeps the original image ratio.
          # -------------------------------------------------------
          IMAGES = [
              {
                  "file": "DP.png",
                  "x": 0,
                  "y": 450,
                  "width": 400,
                  "height": 400,
              },

              {
                  "file": "Among_Us.png",
                  "x": 1100,
                  "y": 20,
                  "width": 150,
                  "height": 150,
              },

              {
                  "file": "CEO.png",
                  "x": 10,
                  "y": 10,
                  "width": 200,
                  "height": 200,
              },

              {
                  "file": "Claude_Crab.jpeg",
                  "x": 620,
                  "y": 660,
                  "width": 175,
                  "height": 175,
              },

              {
                  "file": "Dino.png",
                  "x": 410,
                  "y": 660,
                  "width": 175,
                  "height": 175,
              },

              {
                  "file": "Eat_Sleep_Code_Repeat.jpeg",
                  "x": 410,
                  "y": 100,
                  "width": 150,
                  "height": 150,
              },

              {
                  "file": "Error_404.jpeg",
                  "x": 620,
                  "y": 100,
                  "width": 150,
                  "height": 150,
              },

              {
                  "file": "Think_OutSide_The_Box.jpeg",
                  "x": 830,
                  "y": 100,
                  "width": 150,
                  "height": 150,
              },
          ]

          # -------------------------------------------------------
          # Generate <image> elements
          # -------------------------------------------------------
          embedded_images = []

          for item in IMAGES:
              image_file = Path(item["file"])

              if not image_file.exists():
                  raise FileNotFoundError(
                      f"Image not found: {image_file}"
                  )

              # ---------------------------------------------------
              # Determine MIME type
              # ---------------------------------------------------
              extension = image_file.suffix.lower()

              MIME_TYPES = {
                  ".png": "image/png",
                  ".jpg": "image/jpeg",
                  ".jpeg": "image/jpeg",
              }

              if extension not in MIME_TYPES:
                  raise ValueError(
                      f"Unsupported image format: {extension}"
                  )

              mime_type = MIME_TYPES[extension]

              # ---------------------------------------------------
              # Read ORIGINAL image bytes
              # ---------------------------------------------------
              image_data = image_file.read_bytes()

              # ---------------------------------------------------
              # Convert directly to Base64
              #
              # No vectorization.
              # No resizing.
              # No image conversion.
              # ---------------------------------------------------
              image_base64 = base64.b64encode(
                  image_data
              ).decode("ascii")

              # ---------------------------------------------------
              # Create SVG raster image
              # ---------------------------------------------------
              image_element = f"""
              <image
                x="{item['x']}"
                y="{item['y']}"
                width="{item['width']}"
                height="{item['height']}"
                preserveAspectRatio="xMidYMid meet"
                href="data:{mime_type};base64,{image_base64}"
              />
              """

              embedded_images.append(image_element)

              print(
                  f"Embedded {item['file']} "
                  f"at ({item['x']}, {item['y']}) "
                  f"{item['width']}x{item['height']}"
              )

          # -------------------------------------------------------
          # Put all images on top of the SVG
          # -------------------------------------------------------
          if "</svg>" not in svg:
              raise RuntimeError(
                  "profile-gitblock.svg has no closing </svg>."
              )

          image_layer = "\n".join(embedded_images)

          svg = svg.replace(
              "</svg>",
              image_layer + "\n</svg>",
              1
          )

          # -------------------------------------------------------
          # Write final SVG
          # -------------------------------------------------------
          svg_file.write_text(svg)

          print("")
          print(
              "Successfully embedded all custom images into:"
          )
          print(svg_file)
          PY

          echo ""
          echo "Final SVG generated successfully."

      # ---------------------------------------------------------
      # Commit and push
      # ---------------------------------------------------------
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if git commit -m "update: 3D contribution graph"; then
            git push
          else
            echo "no changes"
          fi
