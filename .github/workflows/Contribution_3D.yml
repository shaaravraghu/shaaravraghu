name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 21 * * *"   # runs daily at 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shaaravraghu

      # Remove ONLY the unwanted bottom-left chart and bottom statistics
      - name: Remove bottom-left chart and statistics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg_dir = Path("profile-3d-contrib")

          for svg_file in svg_dir.glob("*.svg"):
              svg = svg_file.read_text()

              # ---------------------------------------------------------
              # 1. Remove the circular language chart + language legend
              #    from the bottom-left corner.
              #
              #    This covers approximately:
              #    x = 0 -> 225
              #    y = 365 -> 575
              # ---------------------------------------------------------

              chart_mask = '''
              <rect
                x="0"
                y="365"
                width="225"
                height="215"
                fill="white"
              />
              '''

              # ---------------------------------------------------------
              # 2. Remove the contribution / star / fork statistics
              #    along the bottom.
              #
              #    This covers:
              #    x = 225 -> end
              #    y = 575 -> end
              # ---------------------------------------------------------

              bottom_mask = '''
              <rect
                x="225"
                y="575"
                width="735"
                height="65"
                fill="white"
              />
              '''

              # Insert masks immediately before </svg>
              svg = svg.replace(
                  "</svg>",
                  chart_mask + bottom_mask + "</svg>"
              )

              svg_file.write_text(svg)

              print(f"Updated: {svg_file}")
          PY

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if git commit -m "update: 3D contribution graph"; then
            git push
          else
            echo "no changes"
          fi
