name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 21 * * *"   # runs daily at 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shaaravraghu

      # Remove ONLY the unwanted bottom-left chart and bottom statistics
      # Then convert DP.png to SVG and place it on top.
      - name: Remove chart, statistics and add DP
        run: |
          find profile-3d-contrib -type f ! -name "profile-gitblock.svg" -delete

          # ---------------------------------------------------------
          # Verify DP.png exists and is a real PNG
          # ---------------------------------------------------------
          echo "Checking DP.png..."

          if [ ! -f "DP.png" ]; then
            echo "ERROR: DP.png not found!"
            exit 1
          fi

          file DP.png

          if ! file DP.png | grep -qi "PNG image data"; then
            echo "ERROR: DP.png is not a valid PNG!"
            exit 1
          fi

          echo "DP.png verified successfully."

          # ---------------------------------------------------------
          # Install VTracer
          # ---------------------------------------------------------
          python3 -m pip install --user vtracer==0.6.15

          # ---------------------------------------------------------
          # Convert DP.png -> REAL VECTOR SVG
          # ---------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import vtracer

          input_file = Path("DP.png").resolve()
          output_file = Path("DP.svg").resolve()

          print(f"Input : {input_file}")
          print(f"Output: {output_file}")

          vtracer.convert_image_to_svg_py(
              str(input_file),
              str(output_file),
              colormode="color",
              hierarchical="stacked",
              mode="spline",
              filter_speckle=4,
              color_precision=6,
              layer_difference=16,
              corner_threshold=60,
              length_threshold=4.0,
              max_iterations=10,
              splice_threshold=45,
              path_precision=3
          )

          if not output_file.exists():
              raise RuntimeError(
                  "VTracer failed to create DP.svg"
              )

          print(
              f"Created DP.svg "
              f"({output_file.stat().st_size} bytes)"
          )
          PY

          # ---------------------------------------------------------
          # Insert vector DP into profile-gitblock.svg
          # ---------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg_file = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          dp_svg_file = Path("DP.svg")

          if not svg_file.exists():
              raise FileNotFoundError(
                  f"Could not find {svg_file}"
              )

          if not dp_svg_file.exists():
              raise FileNotFoundError(
                  "DP.svg was not created."
              )

          svg = svg_file.read_text()
          dp_svg = dp_svg_file.read_text()

          # ---------------------------------------------------------
          # Get DP.svg's viewBox
          # ---------------------------------------------------------
          root_match = re.search(
              r"<svg[^>]*>",
              dp_svg,
              flags=re.DOTALL
          )

          if not root_match:
              raise RuntimeError(
                  "Could not find SVG root in DP.svg"
              )

          root_tag = root_match.group(0)

          viewbox_match = re.search(
              r'viewBox=["\']([^"\']+)["\']',
              root_tag
          )

          if not viewbox_match:
              raise RuntimeError(
                  "DP.svg does not contain a viewBox."
              )

          viewbox = viewbox_match.group(1)

          print(f"DP.svg viewBox: {viewbox}")

          # ---------------------------------------------------------
          # Extract the vector contents from DP.svg
          # ---------------------------------------------------------
          content_match = re.search(
              r"<svg[^>]*>(.*?)</svg>",
              dp_svg,
              flags=re.DOTALL
          )

          if not content_match:
              raise RuntimeError(
                  "Could not extract DP.svg contents."
              )

          dp_content = content_match.group(1)

          # Remove XML declaration if present
          dp_content = re.sub(
              r"<\?xml.*?\?>",
              "",
              dp_content,
              flags=re.DOTALL
          )

          # ---------------------------------------------------------
          # Place DP at bottom-left
          #
          # Position:
          #   x = 25
          #   y = 515
          #
          # Size:
          #   200 x 200
          # ---------------------------------------------------------
          dp_vector = f"""
          <svg
            x="25"
            y="515"
            width="200"
            height="200"
            viewBox="{viewbox}"
            preserveAspectRatio="xMidYMid meet"
          >
            {dp_content}
          </svg>
          """

          # ---------------------------------------------------------
          # Mask unwanted bottom-left language chart
          # ---------------------------------------------------------
          chart_mask = """
          <rect
            x="0"
            y="500"
            width="500"
            height="575"
            fill="white"
          />
          """

          # ---------------------------------------------------------
          # Mask bottom contribution/star/fork statistics
          # ---------------------------------------------------------
          bottom_mask = """
          <rect
            x="225"
            y="800"
            width="735"
            height="65"
            fill="white"
          />
          """

          # ---------------------------------------------------------
          # Put masks and vector DP at the VERY END of the SVG.
          #
          # This ensures the DP is above the masks.
          # ---------------------------------------------------------
          insertion = (
              chart_mask +
              bottom_mask +
              dp_vector
          )

          if "</svg>" not in svg:
              raise RuntimeError(
                  "profile-gitblock.svg has no closing </svg>."
              )

          svg = svg.replace(
              "</svg>",
              insertion + "</svg>"
          )

          svg_file.write_text(svg)

          print("Successfully updated:")
          print(svg_file)
          PY

          # ---------------------------------------------------------
          # Remove temporary vector file.
          # We only want the final generated SVG.
          # ---------------------------------------------------------
          rm -f DP.svg

          echo "DP.svg removed. Final SVG is ready."
          
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if git commit -m "update: 3D contribution graph"; then
            git push
          else
            echo "no changes"
          fi

