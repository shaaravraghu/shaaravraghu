name: Update GitHub Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # --------------------------------------------------
      # 3. Install Sharp
      # --------------------------------------------------

      - name: Install Sharp
        run: npm install sharp


      # --------------------------------------------------
      # 4. Download GitHub Rank
      # --------------------------------------------------

      - name: Download GitHub Rank
        run: |
          curl -L \
            "https://github-stats-extended.vercel.app/api?username=shaaravraghu&rank_icon=percentile&hide=stars,commits,prs,issues,contribs&hide_title=true&hide_border=true&bg_color=00000000" \
            -o rank.svg


      # --------------------------------------------------
      # 5. Download GitHub Insights
      # --------------------------------------------------

      - name: Download GitHub Insights
        run: |
          curl -L \
            "https://git-hub-insights-virid.vercel.app/api/insight?username=shaaravraghu&theme=github_light&graph=true&languages=true&streak=true&stats=true&header=true&summary=true&profile=false" \
            -o insights.svg
          # profile=false: insights.svg was drawing its own avatar
          # circle in the top-left corner. That circle sat at a
          # different offset than our composited rank ring, which
          # is why two separate, misaligned circles showed up
          # instead of a single clean ring like the standalone
          # rank card.


      # --------------------------------------------------
      # 6. Create composite image
      # --------------------------------------------------

      - name: Create high-resolution composite
        run: |
          node <<'EOF'

          const sharp = require("sharp");

          async function main() {

            // ==================================================
            // CONFIGURATION
            // ==================================================

            // Render everything at 3x resolution.
            // This makes the final image much sharper.
            const SCALE = 3;


            // Width AND height cap for the Rank graphic.
            // Halved from 200 -> 100 per request.
            // Using a height cap too (not just width) stops the
            // badge from growing taller than intended when the
            // trimmed source isn't a perfect square (ring + label
            // text stacked = taller-than-wide bounding box).
            const RANK_WIDTH = 100;
            const RANK_HEIGHT = 100;


            // Position of Rank graphic on the Insights image.
            //
            // Increase LEFT  -> moves it right
            // Increase TOP   -> moves it down
            //
            const RANK_LEFT = 10;
            const RANK_TOP = 20;


            // ==================================================
            // LOAD INSIGHTS
            // ==================================================

            const insights = sharp("insights.svg", {
              density: 300
            });


            // ==================================================
            // LOAD + PROCESS RANK
            // ==================================================

            const rank = sharp("rank.svg", {
              density: 300
            });


            // Trim unnecessary transparent/empty space around the
            // Rank graphic. An explicit threshold makes the crop
            // consistent on all sides instead of relying on sharp's
            // default corner-pixel guess, which can crop the ring
            // asymmetrically if there's any soft edge/shadow.
            const rankCropped = await rank
              .trim({ threshold: 10 })
              .resize({
                width: RANK_WIDTH * SCALE,
                height: RANK_HEIGHT * SCALE,
                fit: "inside",            // never exceeds this box,
                                           // even if the source isn't square
                withoutEnlargement: false
              })
              .png({
                compressionLevel: 9
              })
              .toBuffer();


            // Log the actual resulting badge size. If it still
            // overlaps anything, use these numbers (divided by
            // SCALE) to nudge RANK_LEFT/RANK_TOP.
            const rankMeta = await sharp(rankCropped).metadata();
            console.log(
              "Rank badge size:",
              rankMeta.width,
              "x",
              rankMeta.height
            );


            // ==================================================
            // CONVERT INSIGHTS TO HIGH-RES PNG
            // ==================================================

            const base = await insights
              .png({
                compressionLevel: 9
              })
              .toBuffer();


            // ==================================================
            // PUT RANK ON TOP OF INSIGHTS
            // ==================================================

            await sharp(base)
              .composite([
                {
                  input: rankCropped,

                  // Position is multiplied by SCALE
                  // because our image is rendered at 3x.
                  left: RANK_LEFT * SCALE,
                  top: RANK_TOP * SCALE
                }
              ])
              .png({
                compressionLevel: 9
              })
              .toFile("github-cards.png");


            // ==================================================
            // PRINT FINAL IMAGE INFORMATION
            // ==================================================

            const finalMetadata =
              await sharp("github-cards.png").metadata();

            console.log(
              "Final image:",
              finalMetadata.width,
              "x",
              finalMetadata.height
            );
          }


          // ====================================================
          // RUN
          // ====================================================

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });

          EOF


      # --------------------------------------------------
      # 7. Commit generated image
      # --------------------------------------------------

      - name: Commit updated card
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-cards.png

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Update GitHub profile cards"

            git push

          fi
