name: Update GitHub Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # NODE
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==================================================
      # SHARP
      # ==================================================

      - name: Install Sharp
        run: npm install sharp


      # ==================================================
      # DOWNLOAD RANK SVG
      # ==================================================

      - name: Download GitHub Rank
        run: |
          curl -L \
            "https://github-stats-extended.vercel.app/api?username=shaaravraghu&rank_icon=percentile&hide=stars,commits,prs,issues,contribs&hide_title=true&hide_border=true&bg_color=00000000" \
            -o rank.svg


      # ==================================================
      # FIX RANK SVG GEOMETRY
      # ==================================================

      - name: Fix Rank Circle Alignment
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("rank.svg")

          svg = path.read_text()

          svg = svg.replace(
              "transform-origin: -10px 8px;\n",
              ""
          )

          svg = svg.replace(
              "transform: rotate(-90deg);",
              ""
          )

          svg = svg.replace(
              '<circle class="rank-circle" cx="-10" cy="8" r="40" />',
              '<circle class="rank-circle" cx="-10" cy="8" r="40" transform="rotate(-90 -10 8)" />'
          )

          path.write_text(svg)

          print("Rank SVG corrected successfully.")
          PY


      # ==================================================
      # DOWNLOAD INSIGHTS
      # ==================================================

      - name: Download GitHub Insights
        run: |
          curl -L \
            "https://git-hub-insights-virid.vercel.app/api/insight?username=shaaravraghu&theme=github_light&graph=true&languages=true&streak=true&stats=true&header=true&summary=true&profile=true" \
            -o insights.svg


      # ==================================================
      # CREATE HIGH-RES COMPOSITE
      # ==================================================

      - name: Create Composite Image
        run: |
          node <<'EOF'

          const sharp = require("sharp");

          async function main() {

            // ==================================================
            // SETTINGS
            // ==================================================

            const SCALE = 3;

            // Desired final diameter of the rank circle.
            // 60 = 60px final size.
            const RANK_DIAMETER = 60;

            // Position on the Insights image.
            const RANK_LEFT = 16;
            const RANK_TOP = 16;


            // ==================================================
            // RENDER RANK SVG AT 3x
            // ==================================================

            const rank = await sharp("rank.svg", {
              density: 216
            })
              .png()
              .toBuffer();


            // ==================================================
            // CROP THE ACTUAL RANK CIRCLE
            //
            // Original SVG coordinates:
            //
            // Circle center = (145, 48)
            // Radius        = 40
            //
            // Therefore:
            //
            // Left = 105
            // Top  = 8
            // Width = 80
            // Height = 80
            //
            // We use 90x90 for a little padding.
            //
            // Because the SVG is rendered at 3x,
            // multiply ALL coordinates by 3.
            // ==================================================

            const rankCrop = await sharp(rank)
              .extract({
                left: 100 * SCALE,
                top: 3 * SCALE,
                width: 90 * SCALE,
                height: 90 * SCALE
              })
              .resize({
                width: RANK_DIAMETER * SCALE,
                height: RANK_DIAMETER * SCALE
              })
              .png({
                compressionLevel: 9
              })
              .toBuffer();


            // ==================================================
            // RENDER INSIGHTS AT 3x
            // ==================================================

            const insights = await sharp("insights.svg", {
              density: 216
            })
              .png({
                compressionLevel: 9
              })
              .toBuffer();


            // ==================================================
            // OVERLAY RANK
            // ==================================================

            await sharp(insights)
              .composite([
                {
                  input: rankCrop,

                  left: RANK_LEFT * SCALE,
                  top: RANK_TOP * SCALE
                }
              ])
              .png({
                compressionLevel: 9
              })
              .toFile("github-cards.png");


            // ==================================================
            // OUTPUT INFO
            // ==================================================

            const metadata =
              await sharp("github-cards.png").metadata();

            console.log(
              `Created github-cards.png: ${metadata.width}x${metadata.height}`
            );

          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });

          EOF

      # ==================================================
      # COMMIT
      # ==================================================

      - name: Commit updated card
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-cards.png

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix GitHub rank alignment"
            git push
          fi
