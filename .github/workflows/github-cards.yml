name: Update GitHub Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Sharp
        run: npm install sharp

      - name: Download GitHub Rank
        run: |
          curl -L \
            "https://github-stats-extended.vercel.app/api?username=shaaravraghu&rank_icon=percentile&hide=stars,commits,prs,issues,contribs&hide_title=true&hide_border=true&bg_color=00000000" \
            -o rank.svg

      - name: Download GitHub Insights
        run: |
          curl -L \
            "https://git-hub-insights-virid.vercel.app/api/insight?username=shaaravraghu&theme=github_light&graph=true&languages=true&streak=true&stats=true&header=true&summary=true&profile=true" \
            -o insights.svg

      - name: Create high-resolution composite
        run: |
          node <<'EOF'
          const sharp = require("sharp");

          async function main() {

            /*
             * ============================================
             * CONFIGURATION
             * ============================================
             */

            const SCALE = 3;

            // Final displayed size of the rank card
            const RANK_WIDTH = 200;

            // Position of the rank card
            const RANK_LEFT = 20;
            const RANK_TOP = 20;


            /*
             * ============================================
             * LOAD INSIGHTS AT HIGH RESOLUTION
             * ============================================
             */

            const insights = sharp("insights.svg", {
              density: 300
            });

            const insightsMetadata = await insights.metadata();

            console.log(
              "Insights:",
              insightsMetadata.width,
              "x",
              insightsMetadata.height
            );


            /*
             * ============================================
             * LOAD RANK CARD AT HIGH RESOLUTION
             * ============================================
             */

            const rank = sharp("rank.svg", {
              density: 300
            });

            const rankMetadata = await rank.metadata();

            console.log(
              "Rank:",
              rankMetadata.width,
              "x",
              rankMetadata.height
            );


            /*
             * ============================================
             * CROP THE RANK CARD
             *
             * Instead of positioning the entire card,
             * remove unnecessary whitespace so that the
             * actual "Top 8.6%" circle is positioned correctly.
             * ============================================
             */

            const rankCropped = await rank
              .trim({
                background: {
                  r: 255,
                  g: 255,
                  b: 255,
                  alpha: 1
                }
              })
              .resize({
                width: RANK_WIDTH * SCALE,
                withoutEnlargement: false
              })
              .png()
              .toBuffer();


            /*
             * ============================================
             * CREATE HIGH-RES INSIGHTS IMAGE
             * ============================================
             */

            const base = await insights
              .png({
                compressionLevel: 9
              })
              .toBuffer();


            /*
             * ============================================
             * COMPOSITE
             *
             * Coordinates are multiplied by SCALE because
             * the output image is 3x resolution.
             * ============================================
             */

            await sharp(base)
              .composite([
                {
                  input: rankCropped,
                  left: RANK_LEFT * SCALE,
                  top: RANK_TOP * SCALE
                }
              ])
              .png({
                compressionLevel: 9
              })
              .toFile("github-cards.png");


            /*
             * ============================================
             * PRINT FINAL SIZE
             * ============================================
             */

            const finalMetadata =
              await sharp("github-cards.png").metadata();

            console.log(
              "Final:",
              finalMetadata.width,
              "x",
              finalMetadata.height
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-cards.png

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub profile cards"
            git push
          fi
