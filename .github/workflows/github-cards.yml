name: Update GitHub Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # NODE
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==================================================
      # SHARP
      # ==================================================

      - name: Install Sharp
        run: npm install sharp


      # ==================================================
      # DOWNLOAD RANK API
      # ==================================================

      - name: Download GitHub Rank
        run: |
          curl -L \
            "https://github-stats-extended.vercel.app/api?username=shaaravraghu&rank_icon=percentile&hide=stars,commits,prs,issues,contribs&hide_title=true&hide_border=true&bg_color=00000000" \
            -o rank.svg

      - name: Inspect Rank API
        run: |
          echo "===== RANK SVG ====="
          cat rank.svg
          echo "===== END SVG ====="

      # ==================================================
      # DOWNLOAD INSIGHTS API
      # ==================================================

      - name: Download GitHub Insights
        run: |
          curl -L \
            "https://git-hub-insights-virid.vercel.app/api/insight?username=shaaravraghu&theme=github_light&graph=true&languages=true&streak=true&stats=true&header=true&summary=true&profile=true" \
            -o insights.svg


      # ==================================================
      # CREATE COMPOSITE
      # ==================================================

      - name: Create composite image
        run: |
          node <<'EOF'

          const sharp = require("sharp");

          async function main() {

            // ------------------------------------------------
            // SETTINGS
            // ------------------------------------------------

            const SCALE = 3;

            // Half of the previous 200px size
            const RANK_WIDTH = 100;

            // Position of rank on Insights
            const RANK_LEFT = 16;
            const RANK_TOP = 16;


            // ------------------------------------------------
            // RENDER RANK API
            // ------------------------------------------------

            const rank = await sharp("rank.svg", {
              density: 300
            })
            .png()
            .toBuffer();


            // ------------------------------------------------
            // REMOVE WHITE BACKGROUND
            // ------------------------------------------------

            const rankTransparent = await sharp(rank)
              .removeAlpha()
              .linear(1, 0)
              .png()
              .toBuffer();


            // ------------------------------------------------
            // CROP ONLY THE TOP-LEFT RANK AREA
            //
            // IMPORTANT:
            // Adjust these numbers if necessary.
            // ------------------------------------------------

            const rankCrop = await sharp(rank)
              .extract({
                left: 0,
                top: 0,
                width: Math.min(250, (await sharp(rank).metadata()).width),
                height: Math.min(250, (await sharp(rank).metadata()).height)
              })
              .resize({
                width: RANK_WIDTH * SCALE
              })
              .png()
              .toBuffer();


            // ------------------------------------------------
            // RENDER INSIGHTS
            // ------------------------------------------------

            const insights = await sharp("insights.svg", {
              density: 300
            })
              .png()
              .toBuffer();


            // ------------------------------------------------
            // OVERLAY RANK ON INSIGHTS
            // ------------------------------------------------

            await sharp(insights)
              .composite([
                {
                  input: rankCrop,
                  left: RANK_LEFT * SCALE,
                  top: RANK_TOP * SCALE
                }
              ])
              .png({
                compressionLevel: 9
              })
              .toFile("github-cards.png");


            // ------------------------------------------------
            // DONE
            // ------------------------------------------------

            const finalImage =
              await sharp("github-cards.png").metadata();

            console.log(
              "Generated:",
              finalImage.width,
              "x",
              finalImage.height
            );

          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });

          EOF


      # ==================================================
      # COMMIT
      # ==================================================

      - name: Commit updated card
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-cards.png

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Update GitHub profile cards"

            git push

          fi
